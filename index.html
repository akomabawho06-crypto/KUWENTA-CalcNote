<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#eef2fc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuwenta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Kuwenta: a notepad calculator. Type naturally and every line gets its answer.">
<title>Kuwenta — notepad calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --fs:17px;--lh:30px;--gw:34px;--rw:110px;
  --paper:#fcfdff;--chrome:#eef2fc;--chrome2:#dfe7f8;--line:#d3ddf3;--rule:#d5e0f6;--rule2:#b4c3e8;
  --margin:#e5615d;--ink:#3b4670;--mute:#7d88ad;
  --num:#1c3fc4;--op:#d0581f;--fn:#7b3fb8;--unit:#0d8477;--var:#b3286b;--cur:#177a3d;--com:#8a93b3;--head:#14206b;
  --res:#0d1544;--err:#c62d2d;--accent:#d8453f;--caret:#d8453f;--bar:#14206b;--bar-ink:#fff;--bar-mute:#a9b7ee;
  --shadow:0 12px 34px rgba(20,32,107,.22);--neg:#c4302b;--pos:#13803c;
}
[data-theme=dark]{
  --paper:#0f1533;--chrome:#161d42;--chrome2:#232d5c;--line:#28336a;--rule:#1c264f;--rule2:#34427f;
  --margin:#c9514e;--ink:#a9b4dd;--mute:#7f8ab8;
  --num:#8eb0ff;--op:#ffa26b;--fn:#c8a2ff;--unit:#5fd6c4;--var:#ff8fc2;--cur:#7fdc9c;--com:#7080ad;--head:#e6ebff;
  --res:#f1f4ff;--err:#ff7b7b;--accent:#ff6b66;--caret:#ff8a85;--bar:#1e2752;--bar-ink:#fff;--bar-mute:#93a1d8;
  --shadow:0 12px 34px rgba(0,0,0,.55);--neg:#ff837d;--pos:#6fe09a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:920px;margin:0 auto;background:var(--paper);position:relative}
@media(min-width:960px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* header */
header.top{display:flex;align-items:center;gap:4px;padding:8px 8px 8px;padding-top:max(8px,env(safe-area-inset-top));background:var(--chrome);border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;flex:none}
.ib:hover{background:var(--chrome2)}
.ib:active{background:var(--chrome2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.sm{width:32px;height:32px;border-radius:9px}
.ib.sm svg{width:18px;height:18px}
#title{flex:1;min-width:0;font:600 18px var(--ui);color:var(--head);background:transparent;border:0;padding:8px 6px;border-radius:10px;text-overflow:ellipsis}
#title:hover{background:var(--chrome2)}
#title:focus{background:var(--paper);outline:2px solid var(--accent)}

/* sheet */
.sheet{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.paper{position:relative;flex:1 0 auto;background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));background-size:100% var(--lh);background-color:var(--paper)}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--gw) - 5px);width:4px;border-left:1px solid var(--margin);border-right:1px solid var(--margin);opacity:.75;pointer-events:none}
.paper::after{content:"";position:absolute;top:0;bottom:0;right:var(--rw);width:0;border-left:1px solid var(--rule2);pointer-events:none}
.row{display:flex;align-items:flex-start;min-height:var(--lh)}
.gn{flex:none;width:var(--gw);padding-right:14px;text-align:right;color:var(--margin);opacity:.8;font:400 calc(var(--fs) * .7)/var(--lh) var(--mono);user-select:none;-webkit-user-select:none;height:var(--lh)}
.nonum .gn{color:transparent}
.tx{flex:1;min-width:0;padding:0 10px 0 8px;font:400 var(--fs)/var(--lh) var(--mono);white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;color:var(--ink);pointer-events:none}
.rs{flex:none;width:var(--rw);padding:0 12px 0 8px;text-align:right;font:600 calc(var(--fs) * .92)/var(--lh) var(--mono);color:var(--res);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:var(--lh);position:relative;z-index:3}
.rs.ok{cursor:pointer}
.rs.ok:active{background:rgba(216,69,63,.12)}
.rs.as{color:var(--var)}
.rs.neg{color:var(--neg)}
.rs.pos{color:var(--pos)}
.rs.two{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rs .bal{font-weight:400;font-size:.68em;color:var(--mute);overflow:hidden;text-overflow:ellipsis;min-width:0}
.rs .amt{flex:none;white-space:nowrap}
.rs.er{color:var(--err);cursor:pointer}
.rs.so{color:var(--mute);font-weight:400}
#ed{position:absolute;top:0;left:var(--gw);width:calc(100% - var(--gw) - var(--rw));height:var(--lh);margin:0;border:0;padding:0 10px 0 8px;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--caret);resize:none;overflow:hidden;outline:none;font:400 var(--fs)/var(--lh) var(--mono);letter-spacing:normal;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;z-index:2;border-radius:0}
#ed::placeholder{color:var(--mute);-webkit-text-fill-color:var(--mute);opacity:.75}
#ed::selection{background:rgba(216,69,63,.25)}
#pad{height:42vh;height:42dvh}
.h-num{color:var(--num)}.h-op{color:var(--op)}.h-fn{color:var(--fn);font-weight:500}.h-unit{color:var(--unit)}
.h-neg{color:var(--neg)}.h-pos{color:var(--pos)}
.h-dir{color:var(--accent);font-weight:600;background:rgba(229,97,93,.13);border-radius:4px;box-shadow:0 0 0 2px rgba(229,97,93,.13);text-decoration:none}
.h-var{color:var(--var)}.h-def{color:var(--var);font-weight:600}.h-cur{color:var(--cur)}.h-kw{color:var(--fn)}.h-com{color:var(--com);font-style:italic}
.c-head{color:var(--head);font-weight:600}.c-com{color:var(--com);font-style:italic}
.c-head{text-decoration:underline;text-decoration-color:rgba(229,97,93,.5);text-decoration-thickness:2px;text-underline-offset:5px}

/* key row */
.keys{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--chrome);border-top:1px solid var(--line);scrollbar-width:none;flex:none}
.keys::-webkit-scrollbar{display:none}
.k{flex:none;min-width:42px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--head);font:500 16px var(--mono);touch-action:manipulation}
.k:active{background:var(--chrome2)}
.k.w{font-size:14px;color:var(--fn)}
.k.sep{width:1px;min-width:1px;padding:0;border:0;background:var(--line);height:26px;align-self:center;margin:0 2px}

/* stats */
.stats{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bar);color:var(--bar-ink);padding:9px 14px;padding-bottom:max(9px,env(safe-area-inset-bottom))}
.stat{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;color:inherit;padding:0;text-align:left;min-width:0;flex:1}
#tot{flex:1.5}
.chip{flex:none;background:rgba(255,255,255,.14);color:var(--bar-ink);border:0;border-radius:999px;padding:6px 9px;font:600 11px var(--ui)}
.sv.warn{color:#ffb4a8}
.stat.r{align-items:flex-end;text-align:right}
.sl{font:500 12px var(--ui);color:var(--bar-mute);letter-spacing:.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{font:600 20px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stat.r .sv{font-size:16px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(8,12,40,.45);z-index:20}
.scrim.clear{background:transparent}
.menu{position:fixed;top:56px;right:8px;z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:214px;top:calc(56px + env(safe-area-inset-top))}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:9px;font:500 15px var(--ui);color:var(--ink)}
.menu button:hover,.menu button:active{background:var(--chrome2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(88vw,350px);z-index:30;background:var(--paper);border-right:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(-104%);visibility:hidden;transition:transform .2s ease,visibility .2s}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.brand{font:700 24px var(--ui);color:var(--head);letter-spacing:-.01em}
.brand small{display:block;font:500 12px var(--ui);color:var(--mute);letter-spacing:0;margin-top:1px}
.db{flex:1;overflow-y:auto;padding:0 10px 16px}
.newb{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px;font:600 15px var(--ui);margin:6px 0 12px}
.newb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.sh{display:flex;align-items:center;border-radius:12px;margin-bottom:2px}
.sh.on{background:var(--chrome2)}
.shb{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 10px;color:var(--ink)}
.shb b{display:block;font:600 15px var(--ui);color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shb small{display:block;font:400 12.5px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dt{font:600 12px var(--ui);color:var(--mute);margin:18px 8px 8px}
.tps{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
.tp,.pill{border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 13.5px var(--ui)}
.tp:hover,.pill:hover{background:var(--chrome2)}
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,560px);max-height:88vh;max-height:88dvh;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal[hidden],.menu[hidden],.scrim[hidden]{display:none}
.mh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;border-bottom:1px solid var(--line);background:var(--chrome)}
.mh h2{margin:0;font:700 19px var(--ui);color:var(--head)}
.mb{overflow-y:auto;padding:6px 18px 18px}
.mb h3{font:700 13.5px var(--ui);color:var(--head);margin:18px 0 6px}
.ex{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 2px;color:var(--ink)}
.ex:hover,.ex:active{background:var(--chrome)}
.ex code{font:500 14px var(--mono);color:var(--num);word-break:break-word}
.ex span{font:400 12.5px var(--ui);color:var(--mute);text-align:right;flex:none;max-width:45%}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sr>label,.sr>span.lb{font:600 14.5px var(--ui);color:var(--head)}
.seg{display:inline-flex;background:var(--chrome);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--ink);padding:6px 12px;border-radius:8px;font:500 13.5px var(--ui)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.note{font:400 13px/1.45 var(--ui);color:var(--mute);margin:8px 0 0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.danger{color:var(--err)!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));z-index:40;background:var(--head);color:var(--paper);padding:10px 16px;border-radius:12px;font:500 14px var(--ui);box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;max-width:92vw}
[data-theme=dark] .toast{background:#e6ebff;color:#0f1533}
.toast button{background:none;border:0;color:inherit;font:700 14px var(--ui);text-decoration:underline;padding:0}
.toast[hidden]{display:none}
.fix{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--chrome);border-top:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.fix[hidden]{display:none}
.fix{gap:6px}
.fixv{font:600 16px var(--mono);color:var(--num);min-width:58px;text-align:center;flex:none}
.fix .k{font-size:20px;min-width:38px;padding:0 8px}
.fix .k.x{min-width:36px;font-size:16px}
.fix .seg{flex:none;padding:2px;gap:0}
.fix .seg button{padding:6px 6px;font:500 12px var(--mono)}
.syncrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 4px 10px;font:500 12.5px var(--ui);color:var(--mute)}
.syncrow span{min-width:0}
.fld{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:400 14px var(--mono)}
details.how{margin-top:8px;font:400 13px/1.5 var(--ui);color:var(--ink)}
details.how summary{cursor:pointer;font-weight:600;color:var(--head)}
details.how ol{padding-left:18px;margin:8px 0}
pre.rules{background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font:400 12px var(--mono);margin:8px 0}
.h-tag{color:var(--unit);font-weight:500}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sumgrid div{background:var(--chrome);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.sumgrid small{display:block;font:500 12px var(--ui);color:var(--mute)}
.sumgrid b{display:block;font:600 15px var(--mono);color:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumgrid b.neg{color:var(--neg)}.sumgrid b.pos{color:var(--pos)}
.pbar{height:10px;border-radius:99px;background:var(--chrome2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.wr{margin:10px 0}
.wt{display:flex;justify-content:space-between;gap:10px;font:500 14px var(--ui);color:var(--ink)}
.wt em{font-style:normal;color:var(--mute);font-size:12px;margin-left:5px}
.wt b{font:600 14px var(--mono);color:var(--neg)}
.wt b.pos{color:var(--pos)}
.wb{height:6px;border-radius:9px;background:var(--chrome2);margin-top:4px;overflow:hidden}
.wb i{display:block;height:100%;background:var(--neg);opacity:.75}
.wb i.pos{background:var(--pos)}
.lg{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 2px;color:var(--ink)}
.lg:hover,.lg:active{background:var(--chrome)}
.ll{font:500 14px var(--ui);min-width:0;overflow:hidden;text-overflow:ellipsis}
.ll small{display:block;font:400 12px var(--ui);color:var(--mute)}
.la{font:600 14px var(--mono)}.la.neg{color:var(--neg)}.la.pos{color:var(--pos)}
.lb{font:400 12px var(--mono);color:var(--mute);min-width:64px;text-align:right}
.modes{display:flex;width:100%;margin-top:12px}
.modes button{flex:1;padding:8px 4px;font-size:13px}
.alert{border-radius:12px;padding:10px 12px;font:500 13.5px/1.4 var(--ui);margin:10px 0}
.alert.ok{background:rgba(19,128,60,.13);color:var(--pos)}
.alert.warn{background:rgba(196,48,43,.13);color:var(--neg)}
.pie{display:block;margin:10px auto;max-width:250px;width:100%}
.lgd{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 2px;text-align:left;color:var(--ink);font:500 14px var(--ui)}
.lgd i{width:12px;height:12px;border-radius:50%;flex:none}
.lgd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgd em{font-style:normal;color:var(--mute);font:400 12.5px var(--mono)}
.lgd b{font:600 14px var(--mono);color:var(--head)}
.gn{display:flex;align-items:center;justify-content:flex-end}
.fold{border:0;background:none;color:var(--accent);font:700 17px/1 var(--ui);padding:0 7px;min-width:30px;height:var(--lh);cursor:pointer;flex:none;opacity:1}
.nonum .gn{padding-right:2px}
.bal.fk{cursor:pointer;color:var(--accent);font-weight:600}
.h-str{color:var(--head)}
.fold:active{opacity:.55}
.row.child .tx{background:rgba(63,167,196,.08)}
.row.child .rs{font-weight:500}
.k-stub .tx{background:rgba(229,97,93,.07)}
.h-stub{color:var(--mute);font-style:italic}
.h-date{color:var(--unit);font-weight:500}
.k.act{background:var(--accent);border-color:var(--accent);color:#fff;font:600 13.5px var(--ui)}
details.gd{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--paper)}
details.gd summary{padding:12px;cursor:pointer;font:600 15px var(--ui);color:var(--head);list-style:none;display:flex;align-items:center;gap:8px}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary::before{content:'▸';color:var(--accent)}
details.gd[open] summary::before{content:'▾'}
.gd .gb{padding:0 14px 14px;font:400 14px/1.55 var(--ui);color:var(--ink)}
.gd .gb p{margin:8px 0}
.gd .gb code{font:500 13px var(--mono);color:var(--num);background:var(--chrome);padding:1px 5px;border-radius:5px}
.gd .gb pre{background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font:400 12.5px/1.55 var(--mono);color:var(--ink);margin:8px 0;white-space:pre}
.gd .gb ul{margin:6px 0;padding-left:18px}.gd .gb li{margin:3px 0}
details.grp{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--paper)}
details.grp summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 12px;cursor:pointer;font:600 14px var(--ui);color:var(--head);list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:'▸';color:var(--accent);margin-right:6px}
details.grp[open] summary::before{content:'▾'}
details.grp summary span{flex:1;min-width:0}
details.grp summary em{display:block;font:400 12px var(--ui);color:var(--mute);font-style:normal;margin-top:2px}
details.grp summary b{font:600 14px var(--mono)}
details.grp summary b.neg{color:var(--neg)}details.grp summary b.pos{color:var(--pos)}
details.grp .lg{padding-left:12px;padding-right:12px}
.nsrow{display:flex;gap:8px;margin:6px 0 12px}
.nsrow .newb{margin:0;flex:1}
.newb.alt{flex:none;width:auto;padding:12px 16px;background:var(--chrome2);color:var(--head)}
.newb.alt svg{stroke-width:2}
.fh{display:flex;align-items:center;margin:12px 0 2px}
.fhb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 6px;color:var(--head);font:700 12px var(--ui);letter-spacing:.07em;text-transform:uppercase;text-align:left}
.fhb i{width:11px;height:11px;border-radius:4px;flex:none}
.fhb b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhb small{margin-left:auto;font:500 11.5px var(--ui);color:var(--mute);letter-spacing:0}
.fhb .chev{color:var(--mute);width:12px;text-align:center}

<script>
// ==ENGINE START==
class SyntaxErr extends Error{}
class CalcErr extends Error{}
class EmptyErr extends Error{}
const dict=o=>Object.assign(Object.create(null),o);

/* ---------- units ---------- */
const UNITS=dict({}),ALIAS=dict({});
function defU(dim,code,to,from,label,names){UNITS[code]={dim,code,to,from,label};ALIAS[code.toLowerCase()]=code;for(const n of names||[])ALIAS[n]=code;}
const lin=(dim,code,f,label,names)=>defU(dim,code,v=>v*f,b=>b/f,label,names);
lin('length','mm',.001,'mm',['millimeter','millimeters','millimetre','millimetres']);
lin('length','cm',.01,'cm',['centimeter','centimeters','centimetre','centimetres']);
lin('length','m',1,'m',['meter','meters','metre','metres']);
lin('length','km',1000,'km',['kilometer','kilometers','kilometre','kilometres']);
lin('length','inch',.0254,'in',['inches']);
lin('length','ft',.3048,'ft',['foot','feet']);
lin('length','yd',.9144,'yd',['yard','yards']);
lin('length','mi',1609.344,'mi',['mile','miles']);
lin('mass','mg',1e-6,'mg',['milligram','milligrams']);
lin('mass','g',.001,'g',['gram','grams']);
lin('mass','kg',1,'kg',['kilogram','kilograms','kilo','kilos']);
lin('mass','t',1000,'t',['tonne','tonnes']);
lin('mass','oz',.028349523,'oz',['ounce','ounces']);
lin('mass','lb',.45359237,'lb',['lbs','pound','pounds']);
lin('volume','ml',.001,'ml',['milliliter','milliliters','millilitre','millilitres']);
lin('volume','l',1,'L',['liter','liters','litre','litres']);
lin('volume','tsp',.00492892,'tsp',['teaspoon','teaspoons']);
lin('volume','tbsp',.0147868,'tbsp',['tablespoon','tablespoons']);
lin('volume','cup',.236588,'cup',['cups']);
lin('volume','floz',.0295735,'fl oz',[]);
lin('volume','pt',.473176,'pt',['pint','pints']);
lin('volume','qt',.946353,'qt',['quart','quarts']);
lin('volume','gal',3.78541,'gal',['gallon','gallons']);
lin('area','sqm',1,'m²',['m2']);
lin('area','sqft',.09290304,'ft²',['ft2']);
lin('area','sqkm',1e6,'km²',['km2']);
lin('area','acre',4046.8564,'acre',['acres']);
lin('area','ha',1e4,'ha',['hectare','hectares']);
lin('length/time','mps',1,'m/s',[]);
lin('length/time','kph',.2777778,'km/h',['kmh','kmph']);
lin('length/time','mph',.44704,'mph',[]);
lin('length/time','knot',.5144444,'kn',['knots','kn']);
lin('data','byte',1,'B',['bytes']);
lin('data','kb',1e3,'KB',['kilobyte','kilobytes']);
lin('data','mb',1e6,'MB',['megabyte','megabytes']);
lin('data','gb',1e9,'GB',['gigabyte','gigabytes']);
lin('data','tb',1e12,'TB',['terabyte','terabytes']);
lin('data','kib',1024,'KiB',[]);
lin('data','mib',1048576,'MiB',[]);
lin('data','gib',1073741824,'GiB',[]);
lin('data','tib',1099511627776,'TiB',[]);
lin('time','ms',.001,'ms',['msec']);
lin('time','s',1,'sec',['sec','secs','second','seconds']);
lin('time','min',60,'min',['mins','minute','minutes']);
lin('time','h',3600,'hr',['hr','hrs','hour','hours']);
lin('time','day',86400,'day',['days']);
lin('time','week',604800,'week',['weeks','wk','wks']);
lin('time','month',2629800,'month',['months']);
lin('time','year',31557600,'year',['years','yr','yrs']);
lin('angle','rad',1,'rad',['radian','radians']);
lin('angle','deg',Math.PI/180,'°',['degree','degrees','°']);
defU('temp','c',v=>v,b=>b,'°C',['°c','celsius','centigrade']);
defU('temp','f',v=>(v-32)*5/9,b=>b*9/5+32,'°F',['°f','fahrenheit']);
defU('temp','kelvin',v=>v-273.15,b=>b+273.15,'K',['kelvin','kelvins']);
const PLURAL=new Set(['day','week','month','year']);

/* ---------- currency (approximate offline rates; can be refreshed live) ---------- */
const CUR_LIST=[
 ['USD','$',1,['dollar','dollars','bucks']],['EUR','€',.92,['euro','euros']],['GBP','£',.78,['sterling']],
 ['PHP','₱',57,['peso','pesos']],['JPY','¥',150,['yen']],['CNY',null,7.2,['yuan','rmb']],['KRW','₩',1350,[]],
 ['INR','₹',84,['rupee','rupees']],['AUD',null,1.5,[]],['CAD',null,1.36,[]],['SGD',null,1.34,[]],
 ['CHF',null,.88,['franc','francs']],['HKD',null,7.8,[]],['THB','฿',35,['baht']],['MYR',null,4.5,['ringgit']],
 ['IDR',null,16000,['rupiah']],['VND','₫',25000,[]],['AED',null,3.6725,['dirham','dirhams']],['SAR',null,3.75,['riyal','riyals']],
 ['NZD',null,1.65,[]],['MXN',null,18,[]],['BRL',null,5.5,[]],['ZAR',null,18,[]],['SEK',null,10.5,[]],
 ['NOK',null,10.7,[]],['DKK',null,6.9,[]],['TRY','₺',33,['lira']],['RUB','₽',90,['ruble','rubles']]
];
const RATES={},RATES_DEFAULT={},SYMOF={},CURSYM={'$':'USD','€':'EUR','£':'GBP','₱':'PHP','¥':'JPY','₹':'INR','₩':'KRW','฿':'THB','₫':'VND','₺':'TRY','₽':'RUB'};
const ZERO_DEC=new Set(['JPY','KRW','VND','IDR']);
for(const [code,sym,rate,names] of CUR_LIST){
  RATES[code]=rate;RATES_DEFAULT[code]=rate;if(sym)SYMOF[code]=sym;
  defU('cur',code,v=>v/RATES[code],b=>b*RATES[code],code,names);
}

/* ---------- vocab ---------- */
const MULTW=dict({hundred:100,thousand:1e3,million:1e6,billion:1e9,trillion:1e12,dozen:12});
const BASEW=dict({hex:'hex',hexadecimal:'hex',bin:'bin',binary:'bin',oct:'oct',octal:'oct'});
const BASEINFO={hex:[16,'0x'],bin:[2,'0b'],oct:[8,'0o']};
const WORDOPS=dict({plus:'+',minus:'-',times:'*',multiplied:'*',divided:'/',mod:'mod'});
const CONVW=new Set(['to','in','into','as']);
const PCTW=new Set(['of','on','off']);
const AGGW=new Set(['sum','total','subtotal','avg','average','prev','ans']);
const DATEW=new Set(['today','tomorrow','yesterday']);
const CONSTS=dict({pi:Math.PI,e:Math.E,tau:2*Math.PI,phi:(1+Math.sqrt(5))/2});
const F_PLAIN=dict({sqrt:Math.sqrt,cbrt:Math.cbrt,ln:Math.log,log:Math.log10,log10:Math.log10,log2:Math.log2,exp:Math.exp,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,sign:Math.sign});
const F_KEEP=dict({abs:Math.abs,floor:Math.floor,ceil:Math.ceil,trunc:Math.trunc});
const FUNCS=new Set([...Object.keys(F_PLAIN),...Object.keys(F_KEEP),'round','sin','cos','tan','asin','acos','atan','fact','factorial','min','max','sum','avg','average','mean','median','count','pow','mod','gcd','lcm','comb','perm','ncr','npr','hypot','pmt','compound','change']);
const RESERVED=new Set([...AGGW,...CONVW,...PCTW,...DATEW,...Object.keys(CONSTS),...FUNCS]);

/* ---------- value arithmetic ---------- */
const summable=v=>!!v&&!v.date&&v.str===undefined&&!v.pct&&Number.isFinite(v.v);
function inUnitOf(a,b){
  if(!a.u||!b.u||a.u===b.u)return b.v;
  const A=UNITS[a.u],B=UNITS[b.u];
  if(A.dim!==B.dim)throw new CalcErr("Can't mix "+A.label+" and "+B.label);
  return A.from(B.to(b.v));
}
function addMonths(dt,n){
  const day=dt.getDate();dt.setDate(1);dt.setMonth(dt.getMonth()+n);
  const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(day,last));
}
function addVals(a,b,sign){
  if(a.date||b.date){
    if(a.date&&b.date){
      if(sign<0)return {v:Math.round((a.date-b.date)/864e5),u:'day'};
      throw new CalcErr("Can't add two dates");
    }
    if(!a.date&&sign<0)throw new CalcErr("Can't subtract a date from a number");
    const d=a.date?a:b,o=a.date?b:a,u=o.u||'day',n=o.v*sign;
    if(!UNITS[u]||UNITS[u].dim!=='time')throw new CalcErr('Add days, weeks, months or years to a date');
    const dt=new Date(d.date);
    if(u==='month')addMonths(dt,Math.trunc(n));
    else if(u==='year')addMonths(dt,12*Math.trunc(n));
    else if(u==='day')dt.setDate(dt.getDate()+Math.trunc(n));
    else if(u==='week')dt.setDate(dt.getDate()+7*Math.trunc(n));
    else dt.setTime(dt.getTime()+UNITS[u].to(n)*1000);
    return {date:dt};
  }
  if(a.pct&&b.pct)return {v:a.v+sign*b.v,pct:true};
  if(b.pct)return {v:a.v*(1+sign*b.v),u:a.u};
  let av=a.v,bv=b.v,u=a.u||b.u;
  if(a.u&&b.u&&a.u!==b.u){
    const A=UNITS[a.u],B=UNITS[b.u];
    if(A.dim!==B.dim)throw new CalcErr("Can't mix "+A.label+" and "+B.label);
    if(A.dim==='time'&&B.to(1)<A.to(1)){av=B.from(A.to(av));u=b.u;}
    else bv=A.from(B.to(bv));
  }
  return {v:av+sign*bv,u};
}
function compoundUnit(a,b){
  const A=UNITS[a],B=UNITS[b];
  if(!A||!B||a.includes('/')||b.includes('/'))return null;
  if(A.dim==='temp'||B.dim==='temp'||B.dim==='cur'||B.dim==='angle'||A.dim===B.dim)return null;
  const code=a+'/'+b;
  if(!UNITS[code]){
    const bf=B.to(1);
    UNITS[code]={dim:A.dim+'/'+B.dim,code,num:a,den:b,label:A.label+'/'+({h:'h',s:'s'}[b]||B.label),to:v=>A.to(v)/bf,from:x=>A.from(x*bf)};
  }
  return code;
}
function rateMul(r,q){
  const U=UNITS[r.u],Q=UNITS[q.u];
  if(U&&U.den&&Q&&Q.dim===UNITS[U.den].dim){
    const qv=UNITS[U.den].from(Q.to(q.v));
    return {v:r.v*qv,u:U.num};
  }
  return null;
}
function mulVals(a,b){
  if(a.date||b.date)throw new CalcErr("Can't multiply a date");
  if(a.pct&&b.pct)return {v:a.v*b.v,pct:true};
  if(a.u&&b.u){
    const r=rateMul(a,b)||rateMul(b,a);
    if(r)return r;
    throw new CalcErr("Can't multiply these units");
  }
  return {v:a.v*b.v,u:a.u||b.u};
}
function divVals(a,b){
  if(a.date||b.date)throw new CalcErr("Can't divide a date");
  if(b.v===0)throw new CalcErr('Division by zero');
  if(a.u&&b.u){
    const A=UNITS[a.u],B=UNITS[b.u];
    if(A.dim===B.dim)return {v:a.v/inUnitOf(a,b)};
    if(B.den&&A.dim===UNITS[B.num].dim){
      return {v:UNITS[B.num].from(A.to(a.v))/b.v,u:B.den};
    }
    const c=compoundUnit(a.u,b.u);
    if(c)return {v:a.v/b.v,u:c};
    throw new CalcErr("Can't divide these units");
  }
  return {v:a.v/b.v,u:a.u};
}
function modVals(a,b){
  if(a.date||b.date)throw new CalcErr("Can't use a date here");
  if(b.v===0)throw new CalcErr('Division by zero');
  return {v:a.v%b.v,u:a.u};
}
function powVals(a,b){
  if(a.date||b.date)throw new CalcErr("Can't use a date here");
  if(a.u||b.u)throw new CalcErr("Powers of units aren't supported");
  const r=Math.pow(a.v,b.v);
  if(!Number.isFinite(r))throw new CalcErr('Not a valid result');
  return {v:r};
}
function fact(n){
  if(!Number.isInteger(n)||n<0||n>170)throw new CalcErr('Factorial needs a whole number from 0 to 170');
  let r=1;for(let i=2;i<=n;i++)r*=i;return r;
}
function sumVals(list){
  let acc=null;
  for(const x of list){
    if(!acc){acc={v:x.v,u:x.u};continue;}
    try{acc=addVals(acc,x,1);}catch(e){acc={v:acc.v+x.v,u:acc.u};}
  }
  return acc;
}
function convertVal(val,code){
  if(BASEINFO[code]){
    if(val.date||!Number.isFinite(val.v))throw new CalcErr("Can't convert this");
    const [radix,pre]=BASEINFO[code],n=Math.trunc(val.v);
    return {v:n,str:(n<0?'-':'')+pre+Math.abs(n).toString(radix).toUpperCase()};
  }
  if(val.date)throw new CalcErr("Can't convert a date");
  if(val.pct)throw new CalcErr("Can't convert a percentage");
  if(!val.u)throw new CalcErr('Add a unit first, e.g. 5 km to mi');
  const F=UNITS[val.u],T=UNITS[code];
  if(F.dim!==T.dim)throw new CalcErr("Can't convert "+F.label+" to "+T.label);
  return {v:T.from(F.to(val.v)),u:code};
}
function dateWord(w){
  const d=new Date();d.setHours(0,0,0,0);
  if(w==='tomorrow')d.setDate(d.getDate()+1);
  if(w==='yesterday')d.setDate(d.getDate()-1);
  return d;
}

/* ---------- functions ---------- */
function callFn(name,args,ctx){
  const need=k=>{if(args.length<k)throw new CalcErr(name+'() needs '+k+(k>1?' values':' value'));};

const RX_FIX=/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?|\.\d+/g;
function numberAt(pos){
  const v=ed.value,ls=v.lastIndexOf('\n',pos-1)+1;let le=v.indexOf('\n',pos);if(le<0)le=v.length;
  const line=v.slice(ls,le),rel=pos-ls;
  if(/^\s*(#+\s|#+$|\/\/|⋯)/.test(line))return null;
  const ci=line.indexOf('//');if(ci>=0&&rel>ci)return null;
  const dre=/\d{4}-\d{2}-\d{2}/g;let d;
  while((d=dre.exec(line))){if(rel>=d.index&&rel<=d.index+10)return null;}
  RX_FIX.lastIndex=0;let m;
  while((m=RX_FIX.exec(line))){
    const a=m.index,b=a+m[0].length;
    if(rel>=a&&rel<=b){
      const pc=line[a-1];if(pc&&/[A-Za-z_#]/.test(pc))return null;
      if(((line.slice(0,a).match(/["\u201c\u201d]/g)||[]).length)%2===1)return null;
      if(state.settings.numWords!=='amount'){const w=/^[A-Za-z_\u00C0-\u024F][A-Za-z0-9_\u00C0-\u024F]*[0-9][A-Za-z0-9_\u00C0-\u024F]*/.exec(line.slice(b));if(w&&!ALIAS[w[0].toLowerCase()])return null;}

    }

}

function nudge(dir){
  if(!fix)return;
  const old=ed.value.slice(fix.s,fix.s+fix.len),commas=/,/.test(old);
  const v=parseFloat(old.replace(/,/g,''));if(!isFinite(v))return;
  const dp=Math.max(decs(old),decs(step));
  const nv=Math.max(0,+(v+dir*step).toFixed(10));
  let str=nv.toFixed(dp);
  if(commas){const [i,f]=str.split('.');str=i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(f!==undefined?'.'+f:'');}
  nudging=true;
  ed.focus({preventScroll:true});ed.setSelectionRange(fix.s,fix.s+fix.len);
  let ok=false;try{ok=document.execCommand('insertText',false,str);}catch(e){}
  if(!ok){ed.setRangeText(str,fix.s,fix.s+fix.len,'end');ed.dispatchEvent(new Event('input'));}
  fix.len=str.length;fix.text=str;$('fixV').textContent=str;
  ed.setSelectionRange(fix.s,fix.s+fix.len);
  nudging=false;
}

function cleanName(raw){return String(raw||'').trim().replace(/\s+/g,' ').slice(0,30);}
function addFolder(raw){
  const name=cleanName(raw);if(!name)return null;
  const ex=folderNames().find(n=>n.toLowerCase()===name.toLowerCase());if(ex)return ex;
  state.folders.push(name);save();return name;
}
function renameFolder(old,raw){
  const name=cleanName(raw);if(!name||name===old)return;
  if(folderNames().some(n=>n!==old&&n.toLowerCase()===name.toLowerCase())){toast('That folder already exists');return;}
  state.folders=(state.folders||[]).map(n=>n===old?name:n);
  if(!state.folders.includes(name))state.folders.push(name);
  state.sheets.forEach(x=>{if(x.folder===old){x.folder=name;x.ts=Date.now();}});
  if(state.collapsed&&state.collapsed[old]){state.collapsed[name]=true;delete state.collapsed[old];}
  save();
}
function deleteFolder(name){
  state.folders=(state.folders||[]).filter(n=>n!==name);
  state.sheets.forEach(x=>{if(x.folder===name){x.folder='';x.ts=Date.now();}});
  if(state.collapsed)delete state.collapsed[name];
  save();
}

/* ---------- export / import ---------- */
function sheetAsText(){
  const lines=cur().text.split('\n');
  const w=Math.max(0,...lines.map((l,i)=>lastRes[i]&&lastRes[i].val?l.length:0));
  return lines.map((l,i)=>{const r=lastRes[i];return r&&r.val?l.padEnd(w)+'  =  '+fmtVal(r.val,state.settings):l;}).join('\n');
}
function sheetAsCSV(){
  const lines=cur().text.split('\n'),o=state.settings;
  const q=t=>{t=String(t==null?'':t);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const rows=[['Line','Text','Result','Value','Unit','Tags','Block','Balance','Date','Group'].join(',')];
  lines.forEach((l,i)=>{
    if(!l.trim())return;
    const r=lastRes[i]||{};let res='',val='',unit='';
    if(r.val){
      const v=r.val;res=fmtVal(v,o);
      if(v.date)val=v.date.getFullYear()+'-'+String(v.date.getMonth()+1).padStart(2,'0')+'-'+String(v.date.getDate()).padStart(2,'0');
      else if(v.str!==undefined)val=v.str;
      else if(v.pct){val=String(parseFloat((v.v*100).toPrecision(12)));unit='%';}
      else{val=String(parseFloat(v.v.toPrecision(12)));unit=v.u||'';}
    }
    rows.push([i+1,q(l),q(res),val===''?'':(/^[=+@]/.test(val)?q(val):val),q(unit),q((r.tags||[]).join(' ')),q((lastBlocks[r.block]&&lastBlocks[r.block].title)||''),q(r.bal?fmtVal(r.bal,o):''),r.date?r.date.getFullYear()+'-'+String(r.date.getMonth()+1).padStart(2,'0')+'-'+String(r.date.getDate()).padStart(2,'0'):'',q(r.child&&lastRes[r.parent]?lineLabel(lines[r.parent]):'')].join(','));
  });
  return rows.join('\r\n');
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

      let n=0;for(const s of arr){if(typeof s.text==='string'){state.sheets.push({id:uid(),title:String(s.title||'Imported'),text:s.text,ts:Date.now(),folder:String(s.folder||'')});n++;}}
      save();renderDrawer();toast('Imported '+n+' sheet'+(n===1?'':'s'));

  const s=cur(),v=s.text,pre=v.length&&!v.endsWith('\n')?'\n':'';
  s.text=v+pre+t+'\n';s.ts=Date.now();reproject();render();save();
  ed.focus({preventScroll:true});ed.setSelectionRange(ed.value.length,ed.value.length);
  sheetEl.scrollTop=sheetEl.scrollHeight;
}

/* ---------- tag totals ---------- */
function buildTags(){
  const map=new Map();
  lastRes.forEach(r=>{if(r.tags&&r.val&&summable(r.val)&&!r.agg)for(const t of r.tags){if(!map.has(t))map.set(t,[]);map.get(t).push(r.val);}});
  const rows=[...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([t,l])=>'<button class="ex" data-t="#'+esc(t)+'"><code>#'+esc(t)+'</code><span>'+esc(fmtVal(sumVals(l),state.settings))+' · '+l.length+(l.length>1?' lines':' line')+'</span></button>').join('');
  $('tagB').innerHTML=rows?'<p class="note" style="margin-top:12px">Tap a tag to add its total to your sheet.</p>'+rows:'<p class="note" style="margin-top:12px">No tags yet. Add one to any line, like <b>Lunch ₱250 #food</b>. Then write <b>#food</b> on its own line to get the total.</p>';
}
$('tagB').addEventListener('click',e=>{const b=e.target.closest('.ex');if(!b)return;appendLine(b.dataset.t);closeAll();});

/* ---------- settings ---------- */
const SET=[
 ['theme','Theme',[['auto','Auto'],['light','Light'],['dark','Dark']]],
 ['size','Text size',[['S','S'],['M','M'],['L','L'],['XL','XL']]],
 ['decimals','Decimals',[['auto','Auto'],['0','0'],['2','2'],['4','4']]],
 ['thousands','Thousands separator',[[true,'On'],[false,'Off']]],
 ['angle','Trig angles',[['deg','Degrees'],['rad','Radians']]],
 ['lineNums','Line numbers',[[true,'On'],[false,'Off']]],
 ['tapFix','Tap a number to fix it',[[true,'On'],[false,'Off']]],
 ['statScope','Bottom bar totals',[['block','This block'],['sheet','Whole sheet']]],
 ['showBal','Running balance in trackers',[[true,'On'],[false,'Off']]],
 ['autoDate','Auto-date new entries',[[true,'On'],[false,'Off']]],
 ['numWords','Numbers inside names (4in1, A4)',[['text','Part of the name'],['amount','Count as amount']]]
];
function buildSettings(){
  const s=state.settings;
  $('setB').innerHTML=SET.map(([k,l,opts])=>'<div class="sr"><span class="lb">'+esc(l)+'</span><div class="seg" data-k="'+k+'">'+opts.map(([v,t])=>'<button data-v="'+esc(JSON.stringify(v))+'" aria-pressed="'+(s[k]===v)+'">'+esc(t)+'</button>').join('')+'</div></div>').join('')+
  '<div class="sr" style="display:block"><span class="lb">Currency rates</span><p class="note" id="rateNote"></p><div class="btnrow"><button class="pill" id="updRates">Update live rates</button><button class="pill" id="resetRates">Use built-in</button></div></div>'+
  '<div class="sr" style="display:block"><span class="lb">Cloud sync</span><div id="syncBox"></div></div>'+
  '<div class="sr" style="display:block"><span class="lb">Your data</span><p class="note">'+(persistOK?'Sheets are saved on this device, in this browser.':'Saving isn’t available here, so sheets last until you close the page. Open the file in a normal browser tab to keep them — or use Export all.')+'</p><div class="btnrow"><button class="pill danger" id="wipe">Erase everything</button></div></div>';
  rateNote();renderSync();
}
function rateNote(){const n=$('rateNote');if(n)n.textContent=ratesAt?'Live rates fetched '+new Date(ratesAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'.':'Using built-in approximate rates. Update for current exchange rates (needs internet).';}
$('setB').addEventListener('click',e=>{
  const b=e.target.closest('.seg button');
  if(b){const k=b.parentElement.dataset.k;state.settings[k]=JSON.parse(b.dataset.v);save();applySettings();render();buildSettings();return;}
  if(handleSyncClick(e.target.id))return;
  if(e.target.id==='updRates'){updateRates(true);return;}
  if(e.target.id==='resetRates'){for(const c in RATES)RATES[c]=RATES_DEFAULT[c];ratesAt=0;store.set(RKEY,'');rateNote();render();toast('Using built-in rates');return;}
  if(e.target.id==='wipe'){
    const w=e.target;if(w.dataset.sure){store.set(KEY,'');sync.cfg=null;store.set(SKEY,'');state=loadStateFresh();applySettings();loadSheet();closeAll();toast('Everything erased');}
    else{w.dataset.sure='1';w.textContent='Tap again to erase everything';}
  }
});
function loadStateFresh(){const a=mk('Welcome tour',TOUR);return {sheets:[a],cur:a.id,settings:Object.assign({},DEF),deleted:{},folders:[],collapsed:{}};}
async function updateRates(loud){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();
    if(!j||!j.rates)throw new Error('no rates');
    for(const c in RATES)if(j.rates[c])RATES[c]=j.rates[c];
    ratesAt=Date.now();store.set(RKEY,JSON.stringify({rates:RATES,at:ratesAt}));render();rateNote();
    if(loud)toast('Rates updated');
  }catch(e){if(loud)toast("Couldn't reach the rates service — keeping saved rates");}
}

/* ---------- cloud sync (Firebase Realtime Database REST) ---------- */
const RULES='{\n  "rules": {\n    "kuwenta": {\n      "$code": { ".read": true, ".write": true }\n    }\n  }\n}';
const normUrl=u=>{u=(u||'').trim().replace(/\.json$/,'').replace(/\/+$/,'');return /^https:\/\/[^\s/]+/i.test(u)?u:null;};
const newCode=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>(x%36).toString(36)).join('');};
const encKey=c=>'kw1.'+btoa(unescape(encodeURIComponent(JSON.stringify({u:c.url,c:c.code}))));
function decKey(k){
  try{
    k=(k||'').trim();if(!k.startsWith('kw1.'))return null;
    const o=JSON.parse(decodeURIComponent(escape(atob(k.slice(4)))));
    const url=normUrl(o.u);if(!url||!/^[A-Za-z0-9]{8,64}$/.test(o.c))return null;
    return {url,code:o.c};
  }catch(e){return null;}
}
const syncUrl=()=>sync.cfg.url+'/kuwenta/'+sync.cfg.code+'.json';
async function fx(url,opts){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),12000);
  try{return await fetch(url,Object.assign({cache:'no-store',signal:ac.signal},opts));}finally{clearTimeout(t);}
}
function syncErr(e){
  const m=String(e&&e.message||e);
  if(/HTTP 40[13]/.test(m))return 'Permission denied. Check your database rules.';
  if(/HTTP 404/.test(m))return 'Database not found. Check the URL.';
  if(e&&(e.name==='AbortError'||e instanceof TypeError))return 'Offline or blocked';
  return m;
}
function syncMsg(){
  const fmt=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  let t;
  if(!sync.cfg)t='Cloud sync is off';
  else if(sync.busy)t='Syncing…';
  else if(sync.err)t='Not synced: '+sync.err;
  else if(sync.last)t='Synced '+fmt(sync.last);
  else t='Connected';
  const a=$('syncStat'),b=$('syncMsg');if(a)a.textContent=t;if(b)b.textContent=t;
  const btn=$('syncBtn');if(btn)btn.textContent=sync.cfg?'Sync now':'Set up';
}
function applyMerged(m){
  const curId=state.cur,prevFull=expandText(ed.value,hiddenList).full;
  const usedBefore=new Set(state.sheets.map(x=>x.folder).filter(Boolean));
  state.sheets=m.sheets;state.deleted=m.deleted;
  {const usedAfter=new Set(state.sheets.map(x=>x.folder).filter(Boolean));state.folders=(state.folders||[]).filter(f=>usedAfter.has(f)||!usedBefore.has(f));}
  if(!state.sheets.length)state.sheets.push(mk('Sheet 1',''));
  if(!state.sheets.some(x=>x.id===curId))state.cur=state.sheets[0].id;
  flush();
  const s=cur();
  if(s.id!==curId||s.text!==prevFull){
    const pos=ed.selectionStart;hideFix();
    titleEl.value=s.title;reproject();
    try{const p=Math.min(pos,ed.value.length);ed.setSelectionRange(p,p);}catch(e){}
    render();
  }else if(titleEl.value!==s.title)titleEl.value=s.title;
  if(drawer.classList.contains('open'))renderDrawer();
  updateCtx();
}
async function syncNow(loud){
  if(!sync.cfg||sync.busy)return;
  clearTimeout(sync.timer);sync.busy=true;syncMsg();
  try{
    let done=false;
    for(let a=0;a<3&&!done;a++){
      let etag=null,remote=null;
      try{
        const r=await fx(syncUrl(),{headers:{'X-Firebase-ETag':'true'}});
        if(!r.ok)throw new Error('HTTP '+r.status);
        etag=r.headers.get('ETag');remote=await r.json();
      }catch(e){
        if(!(e instanceof TypeError))throw e;
        const r=await fx(syncUrl());if(!r.ok)throw new Error('HTTP '+r.status);
        remote=await r.json();etag=null;
      }
      const m=mergeDocs(state.sheets,state.deleted,remote);
      applyMerged(m);
      if(remoteMatches(remote,m)){done=true;break;}
      const headers={'Content-Type':'application/json'};if(etag)headers['if-match']=etag;
      const p=await fx(syncUrl(),{method:'PUT',headers,body:JSON.stringify(toPayload(m))});
      if(p.status===412)continue;
      if(!p.ok)throw new Error('HTTP '+p.status);
      done=true;
    }
    if(!done)throw new Error('Busy, try again');
    sync.last=Date.now();sync.err='';
    if(loud)toast('Synced');
  }catch(e){sync.err=syncErr(e);if(loud)toast('Sync failed: '+sync.err);}
  finally{sync.busy=false;syncMsg();}
}
function scheduleSync(){if(!sync.cfg)return;clearTimeout(sync.timer);sync.timer=setTimeout(()=>syncNow(false),2500);}
function connectSync(cfg){
  sync.cfg=cfg;store.set(SKEY,JSON.stringify(cfg));sync.last=0;sync.err='';renderSync();syncNow(true);
}
function renderSync(){
  const box=$('syncBox');if(!box)return;
  if(sync.cfg){
    box.innerHTML='<p class="note" id="syncMsg"></p><div class="btnrow"><button class="pill" id="syncNowBtn">Sync now</button><button class="pill" id="syncCopy">Copy sync key</button><button class="pill danger" id="syncOff">Disconnect</button></div><p class="note">On your other device: Settings → Cloud sync → paste this key. Anyone with the key can read and edit your synced sheets, so keep it private. Sheets sync when you open the app, return to the tab, or tap Sync now.</p>';
  }else{
    box.innerHTML='<p class="note">Keep your sheets the same on your phone and computer, using your own free Firebase Realtime Database.</p>'+
    '<details class="how"><summary>How to set it up (about 2 minutes)</summary><ol><li>Open console.firebase.google.com and create a project (free plan).</li><li>Build → Realtime Database → Create database.</li><li>In the Rules tab, paste this and Publish:<pre class="rules" id="rulesPre">'+esc(RULES)+'</pre><button class="pill" id="copyRules">Copy rules</button></li><li>Copy the database URL from the Data tab and paste it below.</li></ol></details>'+
    '<input class="fld" id="syncUrl" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://your-project-default-rtdb.firebaseio.com"><div class="btnrow"><button class="pill" id="syncCreate">Start syncing</button></div>'+
    '<input class="fld" id="syncKey" autocomplete="off" spellcheck="false" placeholder="Or paste a sync key from another device"><div class="btnrow"><button class="pill" id="syncJoin">Join with key</button></div>';
  }
  syncMsg();
}
function handleSyncClick(id){
  if(id==='syncCreate'){
    const url=normUrl($('syncUrl').value);if(!url){toast('Enter your https:// database URL');return true;}
    connectSync({url,code:newCode()});return true;
  }
  if(id==='syncJoin'){
    const c=decKey($('syncKey').value);if(!c){toast("That sync key isn't valid");return true;}
    connectSync(c);return true;
  }
  if(id==='syncNowBtn'){syncNow(true);return true;}
  if(id==='syncCopy'){copy(encKey(sync.cfg));return true;}
  if(id==='syncOff'){sync.cfg=null;store.set(SKEY,'');renderSync();toast('Sync turned off. Your sheets stay on this device.');return true;}
  if(id==='copyRules'){copy(RULES);return true;}
  return false;
}
$('syncBtn').addEventListener('click',()=>{if(sync.cfg)syncNow(true);else{buildSettings();openModal($('setM'));}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sync.cfg&&Date.now()-sync.last>15000)syncNow(false);});
addEventListener('online',()=>syncNow(false));

/* ---------- install (PWA) ---------- */
const isWeb=/^https?:$/.test(location.protocol);
let installEv=null;
const installBtn=$('installBtn');
const standalone=(matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
if(isWeb){
  const mf=document.createElement('link');mf.rel='manifest';mf.href='manifest.webmanifest';document.head.appendChild(mf);
  const ic=document.createElement('link');ic.rel='apple-touch-icon';ic.href='icon-192.png';document.head.appendChild(ic);
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;if(!standalone)installBtn.hidden=false;});
addEventListener('appinstalled',()=>{installEv=null;installBtn.hidden=true;toast('Installed');});
if(isWeb&&!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent))installBtn.hidden=false;

/* ---------- boot ---------- */
applySettings();
loadSheet();
syncMsg();
if(sync.cfg)syncNow(false);
if(matchMedia('(pointer:fine)').matches)ed.focus();
if(!ratesAt||Date.now()-ratesAt>12*36e5)updateRates(false);
})();
</script>
